<div class="auth-page">
  <div class="auth-card">
    <h1>{{ 'auth.loginTitle' | transloco }}</h1>

    <form class="auth-form" (submit)="$event.preventDefault(); submit()">
      <label>
        {{ 'auth.email' | transloco }}
        <input
          type="email"
          autocomplete="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required
        />
      </label>

      <label>
        {{ 'auth.password' | transloco }}
        <input
          type="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          required
        />
      </label>

      @if (error()) {
        <p class="auth-error">{{ error()! | transloco }}</p>
      }

      <button type="submit" [disabled]="submitting()">{{ 'auth.loginButton' | transloco }}</button>
    </form>

    <p class="auth-switch">
      {{ 'auth.noAccount' | transloco }}
      <a routerLink="/signup">{{ 'auth.goToSignup' | transloco }}</a>
    </p>
  </div>
</div>
